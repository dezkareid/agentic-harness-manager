# Orca worktree hooks — generated by the ai-team orca-setup skill
# Docs: https://www.onorca.dev/docs/model/worktrees
# This repo has no env files to copy, so setup only installs dependencies.
scripts:
  # Runs in the new worktree after it is created
  setup: |
    set -eu
    : "${ORCA_WORKTREE_PATH:?ORCA_WORKTREE_PATH not set}"
    cd "$ORCA_WORKTREE_PATH"
    pnpm install --frozen-lockfile
  # Runs in the worktree before it is archived/removed
  archive: |
    find . -name node_modules -type d -prune -exec rm -rf {} +
