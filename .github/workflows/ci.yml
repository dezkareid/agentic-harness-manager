name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - next
      - beta
      - alpha
  push:
    branches:
      - main
      - next
      - beta
      - alpha
env:
  HUSKY: 0
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-js
      - name: Lint
        run: pnpm lint
      - name: Test library
        run: pnpm test
      - name: Build
        run: pnpm run build

  # Optional Windows smoke run: symlinks need Developer Mode there, so failures never block.
  test-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-js
      - name: Test library
        run: pnpm test

  release:
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-24.04
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-js
      - name: Build
        run: pnpm run build
      - name: Create .releaserc from template
        run: cp .github/releaserc-template.json ./.releaserc
      - name: Release package
        uses: ./.github/actions/semantic-release
        with:
          working-directory: "."
          tag-format: "agentic-harness-manager-v${version}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
